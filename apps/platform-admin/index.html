<!doctype html>
<html lang="en" class="dark">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="robots" content="noindex, nofollow" />
		<meta name="referrer" content="no-referrer" />
		<!--
			Strict policy: everything comes from this website itself; the only other address is the API
			(the API origin is filled in at build time from VITE_API_URL; empty in development, where /api goes through the dev server).
			Hosting must also send X-Frame-Options: DENY and the same policy as a header.
		-->
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' %API_ORIGIN%; object-src 'none'; base-uri 'self'; form-action 'self'"
		/>
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<title>Trovo Platform</title>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
